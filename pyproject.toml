[project]
name = "agentic-chat-system-study-hub"
version = "0.1.0"
description = "A study hub for agentic chat systems: LangGraph workflows, generative UI and prompt validation"
requires-python = ">=3.11,<3.15"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=0.9.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "responses>=0.23.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "aiohttp>=3.8.0",
    "asyncio>=3.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Pinned EXACTLY and must match the ruff rev in .pre-commit-config.yaml.
    # A floating floor lets the project and the hook resolve different versions,
    # which makes them reformat each other on every commit.
    "ruff==0.16.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# Not an installable package: this repo is study material and validation scripts,
# not a library. uv manages the environment without building a wheel.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python", "test_setup.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Ruff formats Python code blocks inside Markdown/MDX by default. Keep it off:
# scripts/check_snippets.py needs docs-site MDX fences byte-identical to source.
extend-exclude = ["*.md", "*.mdx", "venv/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# python/modulos/ is teaching material: worked examples and their solutions. Its
# long lines are printed Spanish prose and illustrative output, and reflowing them
# to 100 columns hurts the thing the file exists to communicate. The stylistic
# rules below are likewise about production ergonomics, not correctness.
#
# The real code -- python/validation/ and the tests -- is held to the full bar.
"python/modulos/**" = ["E501", "B905", "SIM105", "SIM110", "SIM102", "SIM116", "UP042", "B904"]

[tool.mypy]
# Matches .python-version and the resolved venv. Setting it lower makes mypy
# reject third-party stubs that use newer syntax (numpy needs 3.12+).
python_version = "3.14"
ignore_missing_imports = true
# python/modulos/ is excluded on purpose, not to dodge errors: every module repeats
# the same filenames (01_basico.py, 02_intermedio.py, ...) by design, so mypy cannot
# tell them apart and refuses to check anything at all. They are standalone teaching
# scripts, never imported. The real code -- python/validation/ -- is checked.
exclude = ["venv/", "python/modulos/"]
