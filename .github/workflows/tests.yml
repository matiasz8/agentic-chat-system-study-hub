name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install pytest-cov

      - name: Run linting
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 python/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 python/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

      - name: Run tests
        run: |
          pytest python/ -v --tb=short --cov=python --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage report
        run: |
          coverage report
          coverage html
        continue-on-error: true

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate project structure
        run: |
          # Verify key files exist
          [ -f "package.json" ] && echo "✓ package.json exists" || (echo "✗ package.json missing" && exit 1)
          [ -f "python/requirements.txt" ] && echo "✓ python/requirements.txt exists" || (echo "✗ python/requirements.txt missing" && exit 1)
          [ -f "pages/index.mdx" ] && echo "✓ pages/index.mdx exists" || (echo "✗ pages/index.mdx missing" && exit 1)
          [ -d "python/modulos" ] && echo "✓ python/modulos/ exists" || (echo "✗ python/modulos/ missing" && exit 1)
          [ -d "python/validation" ] && echo "✓ python/validation/ exists" || (echo "✗ python/validation/ missing" && exit 1)
          echo "✓ All required files and directories present"

      - name: Check markdown files
        run: |
          # Check MDX files are valid
          find pages -name "*.mdx" -type f | wc -l | xargs echo "Found"
          echo "✓ MDX files present"
